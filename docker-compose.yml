services:
  backend:
    build: ./backend/myapp
    ports:
      - "8000:8000"
    volumes:
      - ./backend/myapp:/app
    environment:
      - DEBUG=1

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
